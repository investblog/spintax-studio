name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Release publishing is intentionally separate from CI. A release remains tag-driven and
# requires an explicit submission; this workflow verifies the source and Windows build.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the product's platform, Linux is the cheap early signal. Both legs
        # earn their keep: the two things most likely to break in this stack are the
        # byte-string codepage and the line terminator, and they are platform-bound.
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          # The engine is a submodule pinned to a tag (ADR 0001). Without this the build
          # fails on a missing unit, which is a confusing way to say "no engine".
          submodules: recursive

      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fpc

      - name: Install Free Pascal (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install freepascal -y --no-progress
          # choco does not put fpc on PATH for the current step's shell.
          echo "C:\tools\freepascal\bin\i386-win32" >> $env:GITHUB_PATH
          # ...and it ships no usable fpc.cfg, so the compiler runs but finds no units
          # beyond the RTL core: the engine's CI first failed on "Can't find unit
          # Generics.Collections", which lives in units/$fpctarget/rtl-generics and is
          # reached through the wildcard unit paths a generated config provides.
          & "C:\tools\freepascal\bin\i386-win32\fpcmkcfg.exe" `
            -d "basepath=C:\tools\freepascal" `
            -o "C:\tools\freepascal\bin\i386-win32\fpc.cfg"

      - name: Compiler version
        shell: bash
        run: fpc -iV

      - name: Build
        shell: bash
        run: sh ./build.sh

      # Warnings are fatal in this stack: FPC compiles an uninitialised function result or
      # a shadowed variable with only a warning, and those are exactly the defects this
      # kind of code produces. -vm4046 drops the single warning FPC's own generics RTL
      # raises from TDictionary; without it -Sew fails on code we do not own. Suppress that
      # number only — never a warning from src/ or tests/.
      - name: Warnings are errors
        shell: bash
        run: |
          mkdir -p lib/.syntax-check
          for f in src/*.pas tests/*.dpr; do
            fpc -Mdelphi -Sew -vw -vm4046 -Fusrc -Fugui -Fuengine/src -FUlib/.syntax-check -Cn "$f"
          done

      # Studio's own assertions: the host contract (codepage, PostProcess) and the engine
      # baseline the submodule pin is supposed to provide. The engine's golden corpus is
      # NOT run here — it is the engine's acceptance suite, referenced and never vendored
      # (engine decision 0001), and it is gated in the engine's own CI on every push.
      - name: Studio tests
        shell: bash
        run: ./tests/studio_tests

      # The same assertions with overflow and range checks on, mirroring Delphi's Debug
      # configuration. FPC's default build wraps silently.
      - name: Studio tests with overflow checks
        shell: bash
        run: ./tests/studio_tests_checked

      # THE HELP UNIT IS THE GENERATOR'S OUTPUT, and nothing else.
      #
      # The suite already compares an embedded digest against the markdown, which catches the
      # everyday case: the document was edited and the generator was not re-run. It cannot
      # catch the other one -- the GENERATOR changed and nobody re-ran it, leaving a unit that
      # matches its input and no longer matches the script. Regenerating and diffing does.
      #
      # Linux only, and it costs nothing there: make-help.py imports the standard library and
      # nothing else, deliberately, because this runner has Python but no Pillow (the icon and
      # flag generators do need Pillow, which is why their output is simply committed).
      - name: The help unit is the generator's output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/make-help.py
          git diff --exit-code gui/SpxHelpText.pas

      # The same for the About box, and here the stakes are licensing rather than prose:
      # NOTICE.md asks that anything requiring attribution appear in the box, and the suite
      # holds the two to each other -- but only if the unit was regenerated. This is the step
      # that catches "NOTICE.md was edited and the script was not re-run".
      #
      # It needs the submodule, because the engine's version comes from its tag.
      - name: The About unit is the generator's output
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # THE TAGS FIRST. actions/checkout clones the submodule at depth 1, and when the pin
          # is behind the remote's tip -- which it is, deliberately -- git fetches that commit
          # alone and brings no tags with it. `describe` then answers "No names found" and the
          # generator refuses, which would read as "the About unit is stale" and be wrong.
          # Measured by review, reproducing checkout's own submodule command.
          git -C engine fetch --tags --quiet || true
          python3 scripts/make-about.py
          git diff --exit-code gui/SpxAbout.pas

  # The window is built on its own leg, because it needs Lazarus (LCL + SynEdit) where the
  # rest needs only fpc, and because it is Windows the product ships on. The console suite
  # above already gates the engine thread's logic -- what this leg adds is proof that the
  # form, the package dependencies and lazbuild still agree.
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Lazarus
        run: choco install lazarus -y --no-progress

      - name: Build the application
        shell: bash
        run: |
          export PATH="/c/lazarus:$PATH"
          lazbuild gui/SpintaxStudio.lpi
          test -f spintax-studio.exe

  # build.sh drives every consumer's first five minutes with this repository, so it is
  # gated like source rather than trusted.
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint shell scripts
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck build.sh
